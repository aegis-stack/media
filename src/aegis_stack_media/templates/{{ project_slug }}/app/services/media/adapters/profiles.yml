# Conversion profiles this project offers, in the order the picker shows them.
#
# A profile is the result you want, not a list of flags: the title says
# what you get ("GIF for a README"), the description how it comes out, the
# kind which ffmpeg recipe runs, and the numbers how. Add one here and it
# appears in the Media page, the CLI and the picker with no code change.
#
#   kind: which recipe runs (``Kind`` in profiles.py)
#   takes: what it is offered for (video, image, audio); video when absent
#   the settings each kind takes are ``FIELDS`` in profiles.py; any other
#   is refused by name when this file loads

readme-gif:
  title: GIF for a README
  description: Sharp, under 5 MB
  kind: gif
  fps: 12
  width: 960
  max_bytes: 5000000

web-gif:
  title: GIF for chat or a post
  description: Small, under 2 MB
  kind: gif
  fps: 15
  width: 640
  max_bytes: 2000000

mp4:
  title: Video for the web
  description: MP4 that plays anywhere
  kind: video
  crf: 23

# X takes up to 1920x1200, autoplays a video muted and loops a short one:
# the sharp way to post what would have been a GIF.
x-video:
  title: Video for X
  description: H.264, up to 1080p, loops in the feed
  kind: video
  crf: 20
  width: 1920

png:
  title: Screenshot from it
  description: One frame, full size
  kind: image
  at: 1.0

thumb:
  title: Thumbnail
  description: Small preview image
  kind: thumbnail
  at: 1.0
  width: 640

mp3:
  title: Just the audio
  description: MP3
  kind: audio
  takes: [video, audio]
  bitrate: 192k

# For a still: the picture smaller, as a PNG, or as a preview.

photo-jpg:
  title: Smaller image
  description: JPEG, up to 1600 px wide
  kind: jpeg
  takes: [image]
  width: 1600

photo-png:
  title: PNG
  description: Same picture, lossless
  kind: image
  takes: [image]

photo-thumb:
  title: Thumbnail
  description: Small preview image
  kind: thumbnail
  takes: [image]
  width: 640
